# Configuración de Pytest para el proyecto
[pytest]
# Carpeta donde Pytest busca los tests
testpaths = tests

# Etiquetas personalizadas (Clase 4): registrarlas evita advertencias
markers =
    smoke: pruebas críticas y rápidas (login)
    login: casos de prueba de inicio de sesión
    catalogo: casos de prueba de navegación y catálogo
    carrito: casos de prueba de interacción con el carrito

# Logs en consola mientras corren los tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# Logs de ejecución guardados en archivo (evidencia para la entrega)
log_file = reports/logs/ejecucion.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
